<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Limit Fitness - Link in Bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    color-scheme: dark;
    --bg: #0b0b0c;
    --card: #151517;
    --line: #2c2c31;
    --tx: #f2f2f2;
    --mut: #9a9aa3;
    --gold: #d4af37;
    --hd: Oswald, "Arial Narrow", Impact, sans-serif;
    box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
body {
    margin: 0;
    padding: 0;
    background-color: var(--bg);
    color: var(--tx);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: 24px 20px 40px;
}
@media (min-width: 481px) {
    .app-container {
        min-height: auto;
        border-radius: 24px;
        border: 1px solid var(--line);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        margin: 20px 0;
    }
}
.header {
    text-align: center;
    margin-bottom: 24px;
}
.logo {
    font-family: var(--hd);
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--tx);
    margin-bottom: 6px;
}
.tagline {
    font-size: 14px;
    color: var(--mut);
    margin: 0;
}
.bio-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--tx);
    transition: border-color 0.2s ease;
}
.bio-card:hover {
    border-color: var(--gold);
}
.bio-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--hd);
    font-size: 20px;
    color: var(--gold);
    flex-shrink: 0;
}
.bio-info h2 {
    font-size: 16px;
    margin: 0 0 4px 0;
    font-weight: 600;
}
.bio-info p {
    font-size: 13px;
    margin: 0;
    color: var(--mut);
}
.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}
h2.section-title {
    font-family: var(--hd);
    font-size: 20px;
    letter-spacing: 1px;
    margin: 0 0 6px 0;
    text-transform: uppercase;
}
.section-desc {
    font-size: 13px;
    color: var(--mut);
    margin: 0 0 20px 0;
    line-height: 1.4;
}
.form-group {
    margin-bottom: 16px;
}
label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--tx);
}
input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--tx);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
}
.btn {
    width: 100%;
    background: var(--gold);
    color: #000;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: var(--hd);
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: opacity 0.2s;
}
.btn:hover {
    opacity: 0.9;
}
.footer-links {
    margin-top: 24px;
    text-align: center;
    display: flex;
    justify-content: center;
    gap: 20px;
}
.footer-links a {
    font-size: 13px;
    color: var(--mut);
    text-decoration: none;
}
.footer-links a:hover {
    color: var(--tx);
}
</style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <div class="logo">No Limit Fitness</div>
        <p class="tagline">Coaching & Training Programs</p>
    </div>

    <a href="https://www.instagram.com/nolimitfitness96?psln=N3duZzQ2enN5MGF5" class="bio-card" target="_blank">
        <div class="bio-avatar">NL</div>
        <div class="bio-info">
            <h2>Instagram Profile</h2>
            <p>Check out daily workouts & tips</p>
        </div>
    </a>

    <div class="card">
        <h2 class="section-title">Initial Questionnaire</h2>
        <p class="section-desc">Fill out your details below to kickstart your coaching program.</p>
        
        <form id="questionnaireForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="goal">Primary Goal</label>
                <select id="goal" required>
                    <option value="" disabled selected>Select your goal</option>
                    <option value="Fat Loss">Fat Loss & Toning</option>
                    <option value="Muscle Building">Muscle & Strength Building</option>
                    <option value="General Fitness">General Health & Fitness</option>
                </select>
            </div>
            <div class="form-group">
                <label for="experience">Training Experience</label>
                <select id="experience" required>
                    <option value="" disabled selected>Select experience level</option>
                    <option value="Beginner">Beginner (0-1 years)</option>
                    <option value="Intermediate">Intermediate (1-3 years)</option>
                    <option value="Advanced">Advanced (3+ years)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Additional Info / Injuries</label>
                <textarea id="notes" rows="3" placeholder="Tell me about any injuries or specific requirements..."></textarea>
            </div>
            <button type="submit" class="btn">Submit via WhatsApp</button>
        </form>
    </div>

    <div class="footer-links">
        <a href="https://www.instagram.com/nolimitfitness96?psln=N3duZzQ2enN5MGF5" target="_blank">Instagram</a>
        <a href="https://wa.me/447859983976" target="_blank">WhatsApp Direct</a>
    </div>
</div>

<script>
function submitForm(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const goal = document.getElementById('goal').value;
    const experience = document.getElementById('experience').value;
    const notes = document.getElementById('notes').value || 'None';

    const message = `*New Client Inquiry*%0A%0A*Name:* ${encodeURIComponent(name)}%0A*Goal:* ${encodeURIComponent(goal)}%0A*Experience:* ${encodeURIComponent(experience)}%0A*Notes:* ${encodeURIComponent(notes)}`;
    
    const whatsappNumber = '447859983976';
    window.location.href = `https://wa.me/${whatsappNumber}?text=${message}`;
}
</script>
</body>
</html>
